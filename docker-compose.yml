version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: razorpaypulse-db
    environment:
      POSTGRES_DB: razorpaypulse_db
      POSTGRES_USER: postgresusername
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: