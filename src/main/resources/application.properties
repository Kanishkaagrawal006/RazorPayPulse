spring.application.name=razorpaypulse

spring.datasource.url=jdbc:postgresql://localhost:5433/razorpaypulse_db
spring.datasource.username=postgresusername
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.temperature=0.0

server.port=8080

logging.level.com.razorpay.razorpaypulse=INFO

spring.profiles.active=seed,pass1,pass2,pass3